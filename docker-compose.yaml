version: "3.9"

services:
  homeassistant:
    container_name: gv-smarthome-dev
    image: ghcr.io/home-assistant/home-assistant:2026.9.2
    restart: unless-stopped

#network_mode: host
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
#      - ./custom_components:/config/custom_components
    environment:
      - TZ=Europe/Ljubljana
